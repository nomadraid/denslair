<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Den's Lair</title>
<meta name="description" content="Denis' lair — a room on the internet. Watch free classics on the big screen, browse the shelf, poke the fire, play the arcade." />
<meta name="theme-color" content="#0b0806" />

<meta property="og:title" content="Den's Lair" />
<meta property="og:description" content="A room on the internet. Come in, the fire's on." />
<meta property="og:type" content="website" />
<meta property="og:image" content="/assets/plates/night-1254.webp" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<link rel="preload" as="image" href="/assets/plates/day-1672.avif" type="image/avif" fetchpriority="high" />

<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/room.css" />
<link rel="stylesheet" href="/css/fx.css" />
<link rel="stylesheet" href="/css/ui.css" />
<link rel="stylesheet" href="/css/panels.css" />
</head>

<body data-booted="false">

<!-- ══════════════════ BOOT / DOOR ══════════════════ -->
<div id="boot">
  <div class="boot-card">
    <h1 class="boot-mark">DEN'S LAIR</h1>
    <p class="boot-sub">a room on the internet.<br />the fire's on. come in.</p>
    <button id="boot-enter" type="button" disabled>ENTER THE LAIR</button>
    <p class="boot-fine"><span id="boot-progress">warming up the room…</span></p>
  </div>
</div>

<!-- ══════════════════ STAGE ══════════════════ -->
<div id="stage">
  <!-- ambient bleed behind the letterbox bars -->
  <div id="ambilight" aria-hidden="true"></div>

  <!-- everything below is locked to the 1672x941 plate box -->
  <div id="frame">

    <!-- ---------- the room artwork + scene-anchored layers ---------- -->
    <div id="room">
      <picture class="plate plate--day">
        <source type="image/avif" srcset="/assets/plates/day-940.avif 940w, /assets/plates/day-1254.avif 1254w, /assets/plates/day-1672.avif 1672w" sizes="100vw" />
        <source type="image/webp" srcset="/assets/plates/day-940.webp 940w, /assets/plates/day-1254.webp 1254w, /assets/plates/day-1672.webp 1672w" sizes="100vw" />
        <img src="/assets/plates/day-1672.webp" alt="Denis' lair: a loft living room with a big screen, a bookshelf, a fireplace and a sleeping dog." decoding="async" fetchpriority="high" />
      </picture>

      <picture class="plate plate--night" aria-hidden="true">
        <source type="image/avif" srcset="/assets/plates/night-940.avif 940w, /assets/plates/night-1254.avif 1254w, /assets/plates/night-1672.avif 1672w" sizes="100vw" />
        <source type="image/webp" srcset="/assets/plates/night-940.webp 940w, /assets/plates/night-1254.webp 1254w, /assets/plates/night-1672.webp 1672w" sizes="100vw" />
        <img src="/assets/plates/night-1672.webp" alt="" decoding="async" />
      </picture>

      <!-- Live patches: clipped clones of the plate that move a little.
           They sit directly on the plates and BELOW the grade, so the
           colour grade and the day/night crossfade land on them too —
           above the grade they show up as bright rectangles. -->
      <div id="patch-dog" class="patch" aria-hidden="true"></div>
      <div id="patch-blanket" class="patch" aria-hidden="true"></div>

      <!-- colour grade sits over the plates, under everything else -->
      <div id="grade" aria-hidden="true"></div>

      <!-- weather, clipped to the window glass -->
      <div id="fx-window" aria-hidden="true">
        <canvas id="fx-weather"></canvas>
        <div id="fx-city"></div>
      </div>

      <!-- room-wide atmospherics -->
      <div id="fx-lamp" aria-hidden="true"></div>
      <div id="fx-firelight" aria-hidden="true"></div>
      <canvas id="fx-embers" aria-hidden="true"></canvas>
      <canvas id="fx-dust" aria-hidden="true"></canvas>
      <div id="fx-tvglow" aria-hidden="true"></div>
      <div id="fx-vignette" aria-hidden="true"></div>

      <!-- ---------- the television ---------- -->
      <div id="tv-zone" data-state="off">
        <div id="tv-player"></div>
        <canvas id="tv-static" width="160" height="98"></canvas>
        <div id="tv-message"></div>
        <div id="tv-osd"></div>
        <div id="tv-scanlines"></div>
        <div id="tv-glass"></div>
      </div>
      <div id="tv-controls">
        <button id="tv-cinema" type="button" title="cinema mode">⛶</button>
        <button id="tv-eject"  type="button" title="eject">⏏</button>
      </div>

      <!-- ---------- the shelf ---------- -->
      <div id="shelf-zone"></div>

      <!-- ---------- the arcade ---------- -->
      <div id="arcade-zone">
        <canvas id="arcade-screen" width="314" height="190"></canvas>
      </div>

      <!-- ---------- scene-anchored signage ---------- -->
      <div id="neon-tv" class="neon">CHOOSE A MOVIE</div>

      <!-- ---------- interaction layer ---------- -->
      <svg id="hotspots" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-label="Things you can click in the room"></svg>
    </div>

    <!-- ---------- viewport chrome, aligned to the plate box ---------- -->
    <div id="chrome" data-idle="false">

      <header id="topbar">
        <div id="wordmark">
          <span class="wm-main">DEN'S LAIR</span>
          <span class="wm-sub">welcome, <b id="wm-who">guest</b></span>
        </div>

        <nav id="nav" aria-label="Rooms">
          <button data-nav="lair" class="is-active"><i data-ico="home"></i><span>LAIR</span></button>
          <button data-nav="tv"><i data-ico="tv"></i><span>TV</span></button>
          <button data-nav="shelf"><i data-ico="book"></i><span>SHELF</span></button>
          <button data-nav="arcade"><i data-ico="pad"></i><span>ARCADE</span></button>
          <button data-nav="about"><i data-ico="user"></i><span>ABOUT DEN</span></button>
          <button data-nav="recruiters"><i data-ico="case"></i><span>FOR RECRUITERS</span></button>
        </nav>

        <div id="account">
          <button id="signin-btn" type="button">
            <i data-ico="user"></i><span>SIGN IN</span>
          </button>
        </div>
      </header>

      <!-- weather / time control -->
      <section id="weather-card" aria-label="Weather outside the lair">
        <div class="wx-head">
          <span class="wx-ico" id="wx-ico"></span>
          <div class="wx-read">
            <div class="wx-name" id="wx-name">SUNNY</div>
            <div class="wx-temp" id="wx-temp">24°C</div>
          </div>
        </div>
        <div class="wx-where">Outside Den's Lair</div>
        <div class="wx-set" role="group" aria-label="Choose weather">
          <button data-wx="sunny" class="is-active" title="clear day" aria-label="clear day"></button>
          <button data-wx="cloudy" title="overcast" aria-label="overcast"></button>
          <button data-wx="rainy" title="rain" aria-label="rain"></button>
          <button data-wx="night" title="night" aria-label="night"></button>
        </div>
      </section>

      <!-- terminal -->
      <section id="terminal" aria-label="Terminal">
        <div class="term-bar">
          <span class="term-dot"></span> TERMINAL
          <button id="term-min" type="button" title="minimise" aria-label="minimise terminal">—</button>
        </div>
        <div id="term-out" role="log" aria-live="polite"></div>
        <label class="term-line" for="term-in">
          <span class="term-prompt">den@lair:~$</span>
          <input id="term-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type a command" />
        </label>
      </section>

      <!-- the five cards -->
      <nav id="cards" aria-label="Sections">
        <button class="card" data-panel="recruiters" style="--card-accent:#ff6b52">
          <i data-ico="case"></i><b>FOR RECRUITERS</b>
          <span>See my experience, projects &amp; skills</span>
        </button>
        <button class="card" data-panel="library" style="--card-accent:#f2c15c">
          <i data-ico="book"></i><b>ARTICLES &amp; BOOKS</b>
          <span>Thoughts, notes &amp; recommendations</span>
        </button>
        <button class="card" data-panel="arcade" style="--card-accent:#7fb4ff">
          <i data-ico="pad"></i><b>ARCADE</b>
          <span>Play some retro games</span>
        </button>
        <button class="card" data-panel="dataroom" style="--card-accent:#b98bff">
          <i data-ico="chart"></i><b>DATA ROOM</b>
          <span>Live dashboards &amp; cool stats</span>
        </button>
        <button class="card" data-panel="devcorner" style="--card-accent:#5ef0b0">
          <i data-ico="term"></i><b>DEV CORNER</b>
          <span>Code snippets &amp; experiments</span>
        </button>
      </nav>

      <!-- footer -->
      <footer id="footbar">
        <button id="amb-toggle" type="button" aria-label="Toggle ambience">
          <i data-ico="note"></i>
          <span class="amb-txt"><b id="amb-title">LAIR AMBIENCE</b><em id="amb-sub">tap to play</em></span>
        </button>
        <canvas id="amb-viz" width="220" height="26" aria-hidden="true"></canvas>
        <p id="quote"></p>
        <span id="copy">© <span id="year"></span> Den's Lair</span>
        <button id="settings-btn" type="button"><i data-ico="gear"></i><span>SETTINGS</span></button>
      </footer>

      <div id="hint">
        <span>psst — the room is clickable. the shelf, the window, the fire, the dog…</span>
        <button id="hint-x" type="button" aria-label="dismiss">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════ OVERLAYS ══════════════════ -->
<div id="cinema-backdrop"></div>
<div id="tooltip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="panels" aria-hidden="true">
  <div class="panel-backdrop"></div>
  <div id="panel-host" role="dialog" aria-modal="true"></div>
</div>

<noscript>
  <div class="noscript">
    <h1>Den's Lair</h1>
    <p>The lair needs JavaScript to light the fire. In the meantime: I'm Denis, a data &amp; software
       engineer. Reach me at <a href="mailto:hello@denslair.com">hello@denslair.com</a>.</p>
  </div>
</noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
